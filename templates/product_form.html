{% extends "base.html" %}{% block title %}{{ 'Edit product' if product else 'Add product' }}{% endblock %}{% block content %}
<div class="page-heading"><span class="eyebrow pink-eyebrow">CATALOG MANAGEMENT</span><h1>{{ 'Edit product' if product else 'Add a product' }}</h1><p class="muted">Keep your product details clear and up to date.</p></div>
<div class="content-card form-card"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Product name<input name="name" required value="{{ product.name if product else '' }}" placeholder="e.g. Blush Everyday Tote"></label><div class="form-grid"><label>Category<select name="category" required>{% for c in ['Bags','Shoes','Clothing','Accessories'] %}<option {{ 'selected' if product and product.category==c }}>{{ c }}</option>{% endfor %}</select></label><label>Product emoji<input name="emoji" maxlength="8" value="{{ product.emoji if product else '🛍️' }}"></label></div><label>Description<textarea name="description" rows="3" placeholder="Describe your product…">{{ product.description if product else '' }}</textarea></label><div class="form-grid"><label>Price (₱)<input type="number" name="price" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label><label>Stock quantity<input type="number" name="stock" min="0" step="1" required value="{{ product.stock if product else 0 }}"></label></div><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('admin_products') }}">Cancel</a><button class="btn btn-primary">{{ 'Save changes' if product else 'Create product' }} <span>→</span></button></div></form></div>{% endblock %}
